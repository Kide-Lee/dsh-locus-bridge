url: https://github.com/Kide-Lee/dsh-locus-bridge
name: Kide-Lee/dsh-locus-bridge
category: dev
description:
  en: 'Lets DSH act as a Locus client and drive the Unity editor through the Locus native broker: 18 unity_* tools cover connection and editor status (including the Unity/Tuanjie edition and editor responsiveness), C# evaluation on the editor main thread, frame-stepped state machines, Play/Edit mode switching, console log and Editor.log reading, compilation with domain reload or hot patching (a patch assembly built by the bundled compile sidecar and detoured into the running editor), test runs, revision-guarded asset editing, a project-wide asset index backed by a durable SQLite index, Unity YAML reads and searches against either the files on disk or the editor's live in-memory values, a cooperative editor lock, offline Unity documentation, viewport capture, and scene object search and property edits. 5 more code_* tools add Roslyn semantic analysis.'
  zh: '让 DSH 扮演 Locus 客户端，通过 Locus 原生 broker 操作 Unity 编辑器：18 个 unity_* 工具覆盖连接与编辑器状态（含 Unity/团结引擎发行版与响应性）、在主线程执行 C#、跨帧状态机、Play/Edit 模式切换、读取 Console 与 Editor.log、编译并等待域重载或热补丁（补丁程序集由内置编译服务生成并真正挂进运行中的编辑器）、运行测试、带 revision 守卫的资产编辑、由持久化 SQLite 索引支撑的全工程资产检索、Unity YAML 读取与检索（磁盘或编辑器内存实时值）、协作编辑器锁、Unity 官方离线文档、视口截图，以及场景对象检索与属性修改。另有 5 个 code_* 工具提供 Roslyn 语义分析。'
